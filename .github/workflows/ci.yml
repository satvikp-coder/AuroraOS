name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  # ---------------- UI / design prototype ----------------
  ui-tests:
    name: UI unit tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: node tests/unit/aurora-glass.test.js
      - run: node tests/unit/core.test.js
      - run: node tests/unit/broker.test.js
      - run: node tests/unit/settings.test.js

  ui-browser-tests:
    name: Browser interaction tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=1

  prototype-build:
    name: Prototype build / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const fs=require('fs');['index.html','shell.css','tokens.css','app.js','core.js','screens.js','broker.js','settings.js','settings-screen.js'].forEach(f=>{if(!fs.existsSync('aurora-glass/prototype/'+f)){console.error('missing',f);process.exit(1)}});console.log('prototype files OK');"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: JavaScript syntax check
        run: for f in aurora-glass/prototype/*.js; do node --check "$f" || exit 1; done

  # ---------------- ARM64 kernel ----------------
  kernel-build:
    name: ARM64 kernel compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross-toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm make
      - name: Verify toolchain executables
        run: |
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-as --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          qemu-system-aarch64 --version | head -1
      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Verify ELF
        run: |
          file build/kernel.elf | grep -q "aarch64" || { echo "not an aarch64 ELF"; exit 1; }

  kernel-qemu-boot:
    name: QEMU boot smoke test
    runs-on: ubuntu-latest
    needs: kernel-build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm make
      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Run boot smoke test
        run: |
          chmod +x tests/qemu/boot-smoke-test.sh
          ./tests/qemu/boot-smoke-test.sh
      - name: Host tests for the device-tree parser and reservation logic (ASan/UBSan)
        run: |
          chmod +x tests/kernel-host/run.sh
          ./tests/kernel-host/run.sh
      - name: Run interrupt, timer and exception-stack tests
        run: |
          chmod +x tests/qemu/irq-tests.sh
          ./tests/qemu/irq-tests.sh
      - name: Run memory-management tests (allocator, MMU, deliberate faults)
        run: |
          chmod +x tests/qemu/mm-tests.sh
          ./tests/qemu/mm-tests.sh

  # ---------------- Repo integrity ----------------
  repo-integrity:
    name: Formatting and repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify working tree is clean (no untracked build output)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "untracked/modified files present"; exit 1; }
      - name: Run Gitleaks secret scan
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sL --fail "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          # Verify downloaded artifact is a valid gzip archive (integrity check)
          file /tmp/gitleaks.tar.gz | grep -q "gzip compressed data" || { echo "Downloaded artifact is not a valid gzip archive"; exit 1; }
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          # Scan full git history
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} /tmp/gitleaks detect --config .gitleaks.toml --source . -v
      - name: Verify Gitleaks scanner behavior
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sL --fail "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          file /tmp/gitleaks.tar.gz | grep -q "gzip compressed data" || { echo "Downloaded artifact is not a valid gzip archive"; exit 1; }
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x tests/security/scanner-verification-test.sh
          /tmp/gitleaks --version
          bash tests/security/scanner-verification-test.sh /tmp/gitleaks
