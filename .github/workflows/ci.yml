name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  # ---------------- UI / design prototype ----------------
  ui-tests:
    name: UI unit tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: node tests/unit/aurora-glass.test.js
      - run: node tests/unit/core.test.js
      - run: node tests/unit/broker.test.js
      - run: node tests/unit/settings.test.js
      - run: node tests/unit/system.test.js
      - run: node tests/unit/passport.test.js
      - run: node tests/unit/trail.test.js
      - run: node tests/unit/vault.test.js
      - run: node tests/unit/calc.test.js

  ui-browser-tests:
    name: Browser interaction tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=1
      - name: A test run must not modify tracked files or leave untracked ones
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  prototype-build:
    name: Prototype build / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const fs=require('fs');['index.html','shell.css','components.css','tokens.css','app.js','ui.js','system.js','review.js','core.js','screens.js','broker.js','settings.js','settings-screen.js','passport-model.js','passport.js','passport.css'].forEach(f=>{if(!fs.existsSync('aurora-glass/prototype/'+f)){console.error('missing',f);process.exit(1)}});console.log('prototype files OK');"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: JavaScript syntax check
        run: for f in aurora-glass/prototype/*.js; do node --check "$f" || exit 1; done

  # ---------------- ARM64 kernel ----------------
  kernel-build:
    name: ARM64 kernel compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross-toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm make
      - name: Verify toolchain executables
        run: |
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-as --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          qemu-system-aarch64 --version | head -1
      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Verify ELF
        run: |
          file build/kernel.elf | grep -q "aarch64" || { echo "not an aarch64 ELF"; exit 1; }

  kernel-qemu-boot:
    name: QEMU boot smoke test
    runs-on: ubuntu-latest
    needs: kernel-build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm make
      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Run boot smoke test
        run: |
          chmod +x tests/qemu/boot-smoke-test.sh
          ./tests/qemu/boot-smoke-test.sh
      - name: Host tests for the device-tree parser and reservation logic (ASan/UBSan)
        run: |
          chmod +x tests/kernel-host/run.sh
          ./tests/kernel-host/run.sh
      - name: Run userspace tests (EL0 processes, syscalls, scheduler, isolation)
        run: |
          chmod +x tests/qemu/process-tests.sh
          ./tests/qemu/process-tests.sh
      - name: Run interrupt, timer and exception-stack tests
        run: |
          chmod +x tests/qemu/irq-tests.sh
          ./tests/qemu/irq-tests.sh
      - name: Run memory-management tests (allocator, MMU, deliberate faults)
        run: |
          chmod +x tests/qemu/mm-tests.sh
          ./tests/qemu/mm-tests.sh
      - name: Run storage tests (virtio block driver on disposable disk images, persistence across two QEMU runs)
        run: |
          chmod +x tests/qemu/storage-tests.sh
          ./tests/qemu/storage-tests.sh
      - name: Run filesystem tests (AuroraFS persistence over three QEMU runs, authorization, corruption, crash injection)
        run: |
          chmod +x tests/qemu/fs-tests.sh
          ./tests/qemu/fs-tests.sh
      - name: Run program loader tests (executables provisioned on the disk image by the host, launched by name, run at EL0, three QEMU runs)
        run: |
          chmod +x tests/qemu/loader-tests.sh
          ./tests/qemu/loader-tests.sh
      - name: Run native settings registry tests (typed, authorised, persistent across three QEMU runs, corrupt/newer/missing records, injected storage failures)
        run: |
          chmod +x tests/qemu/settings-tests.sh
          ./tests/qemu/settings-tests.sh
      - name: Run the issue #6 end-to-end test (loader + storage + settings together on one disk, three QEMU runs)
        run: |
          chmod +x tests/qemu/e2e-tests.sh
          ./tests/qemu/e2e-tests.sh

  # ---------------- Repo integrity ----------------
  repo-integrity:
    name: Formatting and repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify working tree is clean (no untracked build output)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "untracked/modified files present"; exit 1; }
      - name: Install pinned, checksum-verified Gitleaks
        run: |
          chmod +x tests/security/install-gitleaks.sh
          tests/security/install-gitleaks.sh /tmp/gl > /tmp/gitleaks.path
          cat /tmp/gitleaks.path
      - name: Run Gitleaks secret scan
        run: |
          # Scan full git history
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} "$(tail -1 /tmp/gitleaks.path)" detect --config .gitleaks.toml --source . -v
      - name: Verify Gitleaks scanner behavior
        run: |
          chmod +x tests/security/scanner-verification-test.sh
          bash tests/security/scanner-verification-test.sh "$(tail -1 /tmp/gitleaks.path)"
