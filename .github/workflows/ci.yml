name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  # ---------------- UI / design prototype ----------------
  ui-tests:
    name: UI unit tests (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: node tests/unit/aurora-glass.test.js
      - run: node tests/unit/core.test.js
      - run: node tests/unit/broker.test.js
      - run: node tests/unit/settings.test.js
      - run: node tests/unit/system.test.js
      - run: node tests/unit/passport.test.js
      - run: node tests/unit/trail.test.js
      - run: node tests/unit/vault.test.js
      - run: node tests/unit/calc.test.js
      - run: node tests/unit/notes.test.js
      - run: node tests/unit/clock.test.js
      - run: node tests/unit/contextmenu.test.js
      - run: node tests/unit/index.test.js
      - run: node tests/unit/strings.test.js
      - run: node tests/unit/handoff-docs.test.js

  ui-browser-tests:
    name: Browser interaction tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --workers=1
      - name: A test run must not modify tracked files or leave untracked ones
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  prototype-build:
    name: Prototype build / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const fs=require('fs');['index.html','shell.css','components.css','tokens.css','app.js','ui.js','system.js','review.js','core.js','screens.js','broker.js','settings.js','settings-screen.js','passport-model.js','passport.js','passport.css'].forEach(f=>{if(!fs.existsSync('aurora-glass/prototype/'+f)){console.error('missing',f);process.exit(1)}});console.log('prototype files OK');"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: JavaScript syntax check
        run: for f in aurora-glass/prototype/*.js; do node --check "$f" || exit 1; done

  # ---------------- ARM64 kernel ----------------
  kernel-build:
    name: ARM64 kernel compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 cross-toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm make
      - name: Verify toolchain executables
        run: |
          aarch64-linux-gnu-gcc --version | head -1
          aarch64-linux-gnu-as --version | head -1
          aarch64-linux-gnu-ld --version | head -1
          qemu-system-aarch64 --version | head -1
      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Verify ELF
        run: |
          file build/kernel.elf | grep -q "aarch64" || { echo "not an aarch64 ELF"; exit 1; }

  kernel-qemu-boot:
    name: QEMU boot smoke test
    runs-on: ubuntu-latest
    needs: kernel-build
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm make
      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Run boot smoke test
        run: |
          chmod +x tests/qemu/boot-smoke-test.sh
          ./tests/qemu/boot-smoke-test.sh
      - name: Host tests for the device-tree parser and reservation logic (ASan/UBSan)
        run: |
          chmod +x tests/kernel-host/run.sh
          ./tests/kernel-host/run.sh
      - name: Run userspace tests (EL0 processes, syscalls, scheduler, isolation)
        run: |
          chmod +x tests/qemu/process-tests.sh
          ./tests/qemu/process-tests.sh
      - name: Run interrupt, timer and exception-stack tests
        run: |
          chmod +x tests/qemu/irq-tests.sh
          ./tests/qemu/irq-tests.sh
      - name: Run memory-management tests (allocator, MMU, deliberate faults)
        run: |
          chmod +x tests/qemu/mm-tests.sh
          ./tests/qemu/mm-tests.sh
      - name: Run storage tests (virtio block driver on disposable disk images, persistence across two QEMU runs)
        run: |
          chmod +x tests/qemu/storage-tests.sh
          ./tests/qemu/storage-tests.sh
      - name: Run model read-call tests (SYS_MODEL from EL0 on a verified read-only model volume, hostile arguments, identity, crash mid-read)
        run: |
          chmod +x tests/qemu/model-tests.sh
          ./tests/qemu/model-tests.sh
      - name: Run sound tests (virtio-sound device bring-up only, wav backend, simulated hostile answers; no playback)
        run: |
          chmod +x tests/qemu/sound-tests.sh
          ./tests/qemu/sound-tests.sh
      - name: Run filesystem tests (AuroraFS persistence over three QEMU runs, authorization, corruption, crash injection)
        run: |
          chmod +x tests/qemu/fs-tests.sh
          ./tests/qemu/fs-tests.sh
      - name: Run program loader tests (executables provisioned on the disk image by the host, launched by name, run at EL0, three QEMU runs)
        run: |
          chmod +x tests/qemu/loader-tests.sh
          ./tests/qemu/loader-tests.sh
      - name: Run native settings registry tests (typed, authorised, persistent across three QEMU runs, corrupt/newer/missing records, injected storage failures)
        run: |
          chmod +x tests/qemu/settings-tests.sh
          ./tests/qemu/settings-tests.sh
      - name: Run the issue #6 end-to-end test (loader + storage + settings together on one disk, three QEMU runs)
        run: |
          chmod +x tests/qemu/e2e-tests.sh
          ./tests/qemu/e2e-tests.sh
      - name: Run native graphics tests (fw_cfg and ramfb; the kernel draws, QEMU screendump pixels are verified; no-display boot; 128/256/512 MiB RAM)
        run: |
          chmod +x tests/qemu/gfx-tests.sh
          python3 --version
          qemu-system-aarch64 --version | head -1
          ./tests/qemu/gfx-tests.sh
      - name: Run native input tests (virtio keyboard and tablet; QMP injects events, the guest log and QEMU screendump pixels are verified)
        run: |
          chmod +x tests/qemu/input-tests.sh
          ./tests/qemu/input-tests.sh
      - name: Run native UI tests (Tier 0 Clear demo; QMP keyboard and pointer events; focus ring, activation, modal and no-click-through verified on screendump pixels)
        run: |
          chmod +x tests/qemu/ui-tests.sh
          ./tests/qemu/ui-tests.sh
      - name: Run native Home tests (the real kernel, no test flags; Home, Dock, Spaces and the About modal driven by QMP keyboard and pointer events and verified on screendump pixels; no-input, no-display and UART-only fallbacks; 128 and 512 MiB guests)
        run: |
          chmod +x tests/qemu/home-tests.sh
          ./tests/qemu/home-tests.sh
      - name: Run native text-scale and high-contrast tests (the real shell at 200 percent, 200 percent high contrast, 75 percent and 150 percent high contrast; QMP keyboard and pointer events; every screendump pixel checked against the palette)
        run: |
          chmod +x tests/qemu/scale-tests.sh
          ./tests/qemu/scale-tests.sh
      - name: Run native Settings screen tests (the real kernel; no disk, save, restart and reload, read-only disk and destroyed filesystem; real QMP keyboard events; the registry is the authority)
        run: |
          chmod +x tests/qemu/settings-ui-tests.sh
          ./tests/qemu/settings-ui-tests.sh
      - name: Run scheduler-aware shell tests (EL0 clients run while the real shell is interactive; two CPU-bound clients, yield, block, exit, fault, 25-client churn, no input devices; input latency measured on screendumps)
        run: |
          chmod +x tests/qemu/shell-sched-tests.sh
          ./tests/qemu/shell-sched-tests.sh
      - name: Run EL0 UI client tests (processes loaded by the trusted loader describe surfaces through SYS_UI; the kernel-side compositor validates and draws them; hostile client, no-capability client, input isolation, modal, fault cleanup; real QMP input and screendump pixels)
        run: |
          chmod +x tests/qemu/ui-client-tests.sh
          ./tests/qemu/ui-client-tests.sh
      - name: Run native Pages tests (a live read-only view of the real process table; EL0 clients running; keyboard, pointer and Index navigation; empty state; real QMP input and screendump pixels)
        run: |
          chmod +x tests/qemu/pages-tests.sh
          ./tests/qemu/pages-tests.sh
      - name: Run authorised S0 Aura navigation tests (EL0 clients ask the Action Broker through SYS_UI; the policy decides from the kernel-attested identity and only the shell executes; allowed, denied and crashed-requester scenarios; screendump pixels)
        run: |
          chmod +x tests/qemu/aura-s0-tests.sh
          ./tests/qemu/aura-s0-tests.sh
      - name: Run native Aura screen tests (the real shell; real QMP keyboard typing and a pointer click; the broker decides and the shell executes; open settings, switch to work space, refused commands; 100 percent, 200 percent high contrast, and with busy EL0 clients; screendump pixels)
        run: |
          chmod +x tests/qemu/aura-ui-tests.sh
          ./tests/qemu/aura-ui-tests.sh
      - name: Run native timer service tests (SYS_TIMER 42 against the real shell with EL0 clients; never-early monotonic completion, completion events, per-owner quota, hostile arguments and pointers, foreign ids, 20,000-call flood, owner exit and fault, late client, CPU-starved completion; real QMP input proves the shell stays interactive)
        run: |
          chmod +x tests/qemu/timer-tests.sh
          ./tests/qemu/timer-tests.sh
      - name: Run native Clock screen tests (the real shell on the real SYS_TIMER service; Index to Clock, presets, Start, live countdown, Cancel, a real 1 minute timer finishing off-screen, the completion toast; real QMP keyboard and pointer events and screendump pixels)
        run: |
          chmod +x tests/qemu/clock-tests.sh
          ./tests/qemu/clock-tests.sh
      - name: Run Aura timer command tests (the real shell, broker and SYS_TIMER service; start/cancel/refuse by typed commands, no guessed units, out-of-range and unauthorised requests, a real 1 minute timer finishing off-screen with the toast)
        run: |
          chmod +x tests/qemu/aura-timer-tests.sh
          ./tests/qemu/aura-timer-tests.sh
      - name: Run durable Passport ledger tests (the real kernel and a real AuroraFS disk; grants and revocations survive a guest restart, instance-bound grants do not, damaged / newer / rolled-back ledgers deny everything and stay byte-for-byte untouched, read-only and missing disks disable protected actions, table limits)
        run: |
          chmod +x tests/qemu/ledger-tests.sh
          ./tests/qemu/ledger-tests.sh
      - name: Run native Trail screen tests (read-only view of the audit ledger on the real kernel and ledgers; records, 200 percent text, no disk, read-only disk, rollback; real QMP key and pointer events, screendump pixels and the guest's own lines; nothing on the screen can change a record)
        run: |
          chmod +x tests/qemu/trail-ui-tests.sh
          ./tests/qemu/trail-ui-tests.sh
      - name: Run trusted review modal tests (compositor-owned modal on the real kernel; default focus on Cancel, Enter never approves, locked Approve, early and valid Ctrl+Alt+Delete, Escape, 60 second expiry, nothing underneath receives input, with a hostile EL0 UI client running; S1 execution stays disabled; real QMP input and screendump pixels)
        run: |
          chmod +x tests/qemu/review-tests.sh
          ./tests/qemu/review-tests.sh
      - name: Run real S1 settings execution tests (the shipped kernel with a real disk and keyboard; an Aura command opens the trusted review, Cancel/Escape change nothing, a real approval runs the chain with durable PRE and POST Trail records, the text size really changes and survives a restart; read-only and missing disks refuse honestly)
        run: |
          chmod +x tests/qemu/s1-tests.sh
          ./tests/qemu/s1-tests.sh
      - name: Run native application launcher and Calculator tests (the shipped kernel with a real disk, Index launch through the kernel registry and trusted loader, Pages, real keys 12+8=20, double-launch refusal, exit, cleanup and a fresh relaunch, missing executable and disk refuse honestly)
        run: |
          chmod +x tests/qemu/app-tests.sh
          ./tests/qemu/app-tests.sh
      - name: Run local QEMU package tests (deterministic package build, unsafe inputs refused, fresh install never overwrites a disk, the packaged kernel and disk launch the Calculator)
        run: |
          chmod +x tests/qemu/pkg-tests.sh scripts/package-qemu.sh
          ./tests/qemu/pkg-tests.sh
      - name: Run recovery tests (the packaged production kernel on fresh, blank, corrupt, truncated, wrong-version, foreign, read-only and missing disks and after SIGKILL mid-boot, each must boot, say so and never modify a disk it cannot mount; persistence across restart; bundle verifier accepts the package and rejects tampering)
        run: |
          chmod +x tests/qemu/recovery-tests.sh scripts/package-qemu.sh
          ./tests/qemu/recovery-tests.sh
      - name: Run native Notes tests (EL0 app from the packaged disk; type, save, read back, restart the emulator and reopen the exact text; read-only, missing, corrupt, newer-version and foreign-owned files refuse or hide honestly)
        run: |
          chmod +x tests/qemu/notes-tests.sh
          ./tests/qemu/notes-tests.sh
      - name: Run native Files viewer tests (EL0 app, identity 603; lists only what AuroraFS lets it read, previews text, refuses binary, bounds, first-16 notice, no disk)
        run: |
          chmod +x tests/qemu/files-tests.sh
          ./tests/qemu/files-tests.sh
      - name: Run persistent Spaces tests (select a Space, restart the emulator on the same disk and see it restored; the Calculator is not resumed; read-only, no disk, corrupt, out-of-range and pre-Spaces records handled honestly)
        run: |
          chmod +x tests/qemu/spaces-tests.sh
          ./tests/qemu/spaces-tests.sh
      - name: Run multi-app lifecycle tests (Calculator, Notes and Files together; isolation, independent exit, fresh relaunch)
        run: |
          chmod +x tests/qemu/lifecycle-tests.sh
          ./tests/qemu/lifecycle-tests.sh
      - name: Run hold-to-confirm demo tests (real held key and pointer, 1.5 s, one confirmation, cancels)
        run: |
          chmod +x tests/qemu/hold-tests.sh
          ./tests/qemu/hold-tests.sh

  # ---------------- Repo integrity ----------------
  repo-integrity:
    name: Formatting and repository integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify working tree is clean (no untracked build output)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "untracked/modified files present"; exit 1; }
      - name: Install pinned, checksum-verified Gitleaks
        run: |
          chmod +x tests/security/install-gitleaks.sh
          tests/security/install-gitleaks.sh /tmp/gl > /tmp/gitleaks.path
          cat /tmp/gitleaks.path
      - name: Run Gitleaks secret scan
        run: |
          # Scan full git history
          GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} "$(tail -1 /tmp/gitleaks.path)" detect --config .gitleaks.toml --source . -v
      - name: Verify Gitleaks scanner behavior
        run: |
          chmod +x tests/security/scanner-verification-test.sh
          bash tests/security/scanner-verification-test.sh "$(tail -1 /tmp/gitleaks.path)"
